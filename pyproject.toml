[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-agent-guard"
version = "0.1.0"
description = "The budget your agent can't raise: human-signed spend mandates with offline-verifiable receipts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["cryptography>=42"]

[project.scripts]
algovoi-agent-guard = "algovoi_agent_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
